

name: Deploy Next.js to IIS

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nextjs-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to IIS server
        shell: powershell
        run: |
                   $ErrorActionPreference = "Stop"

                    $source = $env:GITHUB_WORKSPACE
                    $destination = "C:\webserver\business"

                    if (!(Test-Path "$source\.next\BUILD_ID")) {
                    throw "Next.js build output not found"
                    }

                    if (!(Test-Path $destination)) {
                      New-Item -ItemType Directory -Path $destination -Force
                    }

                    # Stop application before deployment if necessary

                    Remove-Item "$destination\*" -Recurse -Force

                    Copy-Item "$source\*" $destination -Recurse -Force

                    Write-Host "Deployment completed"
